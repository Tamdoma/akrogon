      3. Verify every finding against the code, contract and cited evidence, including CHECKED claims. Re-read each named function for wider consequences. Re-run one randomly selected evidence line this round, name the selection and command output in your judgment, and reject a block whose evidence does not reproduce. Give every finding a reason with its own evidence. Use accept for a verified defect needing repair, reject for a disproven claim, and confirmed for a verified CHECKED or no-action claim. Check verification coverage against changed surfaces, reproduce stale, missing or disputed results, and preserve unresolved verification gaps explicitly.
      4. Before a clean verdict, run the final duty in this worktree, on this branch, in this order. First the reference index: run `bun issues/.scripts/audit-reference-index-drift.ts --worktree {item}` from the worktree root when the repo carries that script and config.yaml declares `grounding.index`; it reports one row per changed indexed path between the branch's merge base and its head. Repair the inline-repair-eligible rows in the index by row key — union rows, never overwrite a whole file. Rule on every ambiguous row yourself and record the ruling with its reason in your verdict. A row that needs a code change is another hunt, not a clean verdict. Where the script or `grounding.index` is absent, run the drift check against the index yourself. Then the documentation rule: skip docs for minor fixes, internal refactors, test- or CI-only changes, and typo edits; update docs and the index when the change moves agent- or user-facing contracts, conventions, routing, schemas, guides, subroutines, or indexed files whose linked docs may now be stale. Where an update is called for, make it surgically — the smallest edit that records the change's new current truth, written into the passage that already carries the subject rather than appended as a detached or dated note, deleting or rewriting in the same edit the prose the change made untrue, and never leaving new content standing beside the old content it contradicts. Commit these edits here, on the item branch, under {documentation_paths} and this item's own folders only: nothing edits the default branch, and these are the only commits allowed between the code SHA and your verdict. Record the code SHA ruled on as branch HEAD before your own commits. Before writing the table, use git history to verify that every commit after that code SHA touches only docs, index, or this item's folder paths. A code change requires another hunt instead of a clean verdict. Write {commit_path} as the committed accept/reject/confirmed table for every finding with its id, disposition, reason and evidence, plus code SHA, round, and verification output. Only accept findings route to repair. Confirmed findings require no repair row and do not prevent a clean verdict. Never merge or mutate lifecycle state yourself.
