issues_root: issues
scripts_dir: issues/.scripts
worktree_root: issues/worktrees
branch_prefix: worktree-
repos:
  akrogon:
    path: ~/Work/infra/akrogon
    remote: origin
    default_branch: main
    worktree_root: issues/worktrees
    env_source: ~/Work/infra/akrogon
    tab: akrogon
  framework:
    path: ~/Work/infra/akrogon-repos/framework
    remote: origin
    default_branch: main
    worktree_root: issues/worktrees
    env_source: ~/Work/infra/tamdoma/framework
    tab: framework
quality:
  analyzed_scopes: [herdr, skills/consolidate-issues/scripts, skills/consult-issue/scripts, skills/init-issues/scripts]
gate:
  thresholds:
    cyclomatic: 10
    cognitive: 15
    max_depth: 4
    function_lines: 80
    params: 4
  secrets_scanner_version: 3.97.4
  certificate_path: issues/certificates/gate.jsonl
grounding:
  index: docs/reference-index.md
  indexed_scopes:
    - docs/
    - herdr/
    - issues/.scripts/
    - issues/.scripts/lifecycle/
    - issues/.scripts/merge-finalize/
    - issues/.scripts/tests/
    - issues/.scripts/verification/
    - skills/
  docs:
    - docs/architecture.md
    - docs/operations.md
    - issues/precedents.md
  surfaces:
    - README.md
    - issues/config.yaml
broadcast:
  discord:
    webhook_env:
      - DISCORD_WEBHOOK_URL_1
      - DISCORD_WEBHOOK_URL_2
roles:
  consultant:
    # Advises on difficult decisions: strong reasoning models such as Fable 5.1 or Astra, usually medium effort.
    - runtime: claude
      model: claude-fable-5-1
      compaction: 20
      effort: medium
      pane:
        agent_kind: claude
        create: { tab: repo }
    - runtime: codex
      model: gpt-6-astra
      compaction: default
      effort: medium
      pane:
        agent_kind: codex
        create: { tab: repo }
  implementer:
    # Writes the leaf and runs focused checks: current trial is Luna 5.6 xhigh/fast; use speed: default for standard mode.
    - runtime: codex
      model: gpt-5.6-luna
      compaction: default
      effort: xhigh
      speed: fast
      pane:
        agent_kind: codex
        create: { tab: repo }
  judge:
    # Finds concrete defects and checks evidence: strong reviewers such as Opus medium or Sol high; keep each review in fresh context.
    - runtime: claude
      model: 'claude-opus-5[1m]'
      compaction: 20
      effort: medium
      pane:
        agent_kind: claude
        create: { tab: repo }
    - runtime: pi
      model: openai-codex/gpt-5.6-sol
      compaction: default
      effort: high
      pane:
        agent_kind: pi
        create: { tab: repo }
  verifier:
    # Checks the implementation or a named repair: Fable 5.1 medium is the current cost/speed choice.
    - runtime: claude
      model: claude-fable-5-1
      compaction: 20
      effort: medium
      pane:
        agent_kind: claude
        create: { tab: repo }
  synthesizer:
    # Turns settled decisions into one implementable contract: a strong reasoning model such as Astra at medium effort.
    - runtime: codex
      model: gpt-6-astra
      compaction: default
      effort: medium
      pane:
        agent_kind: codex
        create: { tab: repo }
  arbiter:
    # Resolves conflicting advice or blocked decisions: strong models such as Fable or Astra, with high effort for difficult disputes.
    - runtime: claude
      model: claude-fable-5-1
      compaction: default
      effort: high
      pane:
        agent_kind: claude
        create: { tab: repo }
    - runtime: codex
      model: gpt-6-astra
      compaction: default
      effort: high
      pane:
        agent_kind: codex
        create: { tab: repo }
  broadcaster:
    # Rewrites merged work into clear user updates: a small fast model such as Haiku 4.5 at medium effort; configure exactly one seat.
    - runtime: claude
      model: claude-haiku-4-5
      compaction: default
      effort: medium
      pane:
        agent_kind: claude
        create: { tab: repo }
  docs_lens:
    # Checks documentation against code: a small fast model such as Haiku 4.5 at medium effort suits this focused task.
    - runtime: claude
      model: claude-haiku-4-5
      compaction: default
      effort: medium
      pane:
        agent_kind: claude
        create: { tab: repo }
grammar:
  claude:
    invocation: '/{skill}'
    clear_command: '/clear'
    model_command: '/model {model}'
    effort_command: '/effort {effort}'
    model_flag: '--model'
    effort_flag: '--effort'
    launch:
      agent_kind: claude
      command: claude
      args:
        [
          '--permission-mode',
          'bypassPermissions',
          '--disallowed-tools',
          'AskUserQuestion',
          '--settings',
          '{"autoCompactEnabled":true,"autoCompactWindow":1000000,"statusLine":{"type":"command","command":"bun run \"$HOME/.claude/scripts/claude-statusline/statusline.ts\""}}'
        ]
      config_home_env: CLAUDE_CONFIG_DIR
      env:
        CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: '{compaction}'
  pi:
    invocation: '/skill:{skill}'
    clear_command: '/clear'
    model_command: '/model {model}'
    effort_command: '/effort {effort}'
    model_flag: '--model'
    effort_flag: '--thinking'
    launch:
      agent_kind: pi
      command: pi
      args:
        [
          '--no-approve',
          '--no-skills',
          '--exclude-tools',
          'ask_question,subagent_spawn,subagent_wait,subagent_cancel,subagent_check,subagent_list,subagent_reply'
        ]
      config_home_env: PI_CODING_AGENT_DIR
      env:
        PI_CODING_AGENT_DIR: '{home}/.pi/seats/{seat}/{compaction}'
  codex:
    invocation: '${skill}'
    clear_command: ''
    model_command: ''
    effort_command: ''
    model_flag: '--model'
    effort_flag: '-c'
    launch:
      agent_kind: codex
      command: codex
      args: ['--ask-for-approval', 'never', '--sandbox', 'danger-full-access']
      config_home_env: CODEX_HOME
reconciler:
  tick_interval_seconds: 45
  step_timeout_minutes: 240
  median_machine_time_hours: 4
  examine_machine_time_hours: 8
  median_cost_usd: 15
  queue_start_hours: 24
  herdr_version: 0.8.2
  questions_path: issues/QUESTIONS.md
dispatch:
  rebuttal_rounds: 1
  plan_bytes: 98304
  chunk_bytes: 16384
  packet_bytes: 49152
  decisions_bytes: 8192
  rulebook_path: issues/judge-rulebook.md
  transport_retries: 3
  attempt_cap: 3
  tick_backoff_seconds: 300
  receipt_window_seconds: 120
  heartbeat_window_seconds: 3600
  prompts:
    broadcast: |
      Write your dispatch receipt now: one timestamp line at {receipt}. Append an ISO8601 progress line to {heartbeat} at each completed step. Both files stay uncommitted.

      {skill:broadcast-issue}

      Assignment: compose the completed category update for repository {repo} from the pinned evidence below. Use the repository's public name in the title. Apply the skill's writing rules. The machinery owns target validation, preview, sending, and delivery receipts for this assignment. Do not invoke the Discord sender yourself.

      {broadcast_context}

      Write a JSON object to {worktree}/.evidence/broadcast-copy.json with summary, whats_new, and spend. The spend string names your harness-recorded session cost and its source, or states why it was not recorded. For a large update, include continuation with its own summary and whats_new. Use as many useful bullets as needed. Do not commit or change any tracked worktree file: this leaf has already merged.

      Submit the payload through the machinery:
      cd "{control_root}" && bun "{source_root}/issues/.scripts/reconciler/akrogon.ts" broadcast-copy "{item}" "{liveness_id}" "{worktree}/.evidence/broadcast-copy.json"

      This command records the payload in control state. Fix any rejected payload and retry the command within this assignment. Stop after it succeeds. Do not merge, archive, or send messages.

      {diagnostics}
    seed-import: |
      Item {item} in repo {repo}, step {step}, attempt {attempt}. Worktree {worktree}, branch {branch}.

      Write your dispatch receipt now: one timestamp line at {receipt}. Append one line to {heartbeat} at every step you finish, starting each line with the current ISO8601 timestamp. Neither file is committed; both live under the worktree's .evidence/ directory.

      Task: archive the seed the item's state.yaml names into {proof_dir} and commit it.

      Commit exactly one path: run `git add {commit_path}` then commit that path alone. A commit refused on git's index lock is retried after a short pause.

      Required proof: {required_proof}

      Write your harness-recorded session spend into the artifact you commit, as a `spend:` line naming the figure and the harness field it came from.

      If a question blocks you that your read paths do not settle, write it to {question_record} — the question, your options, your recommended option — commit it, and stop. Never ask in the pane; nothing reads it. You will be restarted with the answer.
      {diagnostics}
    consult-position: |
      Item {item} in repo {repo}, step {step}, attempt {attempt}. Worktree {worktree}, branch {branch}.

      Write your dispatch receipt now: one timestamp line at {receipt}. Append one line to {heartbeat} at every step you finish, starting each line with the current ISO8601 timestamp. Neither file is committed; both live under the worktree's .evidence/ directory.

      Task: read the item's brief and design under {proof_dir} and write your independent position, ending in a `## Decision Table` section that states one resolution per open question with its reasons.

      Commit exactly one path: run `git add {commit_path}` then commit that path alone. A commit refused on git's index lock is retried after a short pause. Other seats write their own files in this same worktree; leave those alone.

      Required proof: {required_proof}

      Write your harness-recorded session spend into the artifact you commit, as a `spend:` line naming the figure and the harness field it came from.

      If a question blocks you that your read paths do not settle, write it to {question_record} — the question, your options, your recommended option — commit it, and stop. Never ask in the pane; nothing reads it. You will be restarted with the answer.
      {diagnostics}
    rebuttal: |
      Item {item} in repo {repo}, step {step}, attempt {attempt}. Worktree {worktree}, branch {branch}.

      Write your dispatch receipt now: one timestamp line at {receipt}. Append one line to {heartbeat} at every step you finish, starting each line with the current ISO8601 timestamp. Neither file is committed; both live under the worktree's .evidence/ directory.

      Task: read the peer position files under {proof_dir}/positions/ and append `## Rebuttal Addendum` with a `### Rebuttal Round {round}` subsection to your own position file, contesting the peer's claims by number. Label every disagreement evidence or concern. Self-attribution quoting is banned: do not quote your own earlier position as authority. This is round {round} of the configured {rebuttal_rounds} fixed rounds. Append only this round, preserving prior rounds; the reconciler dispatches each successive round. Never add adaptive rounds.

      Commit exactly one path: run `git add {commit_path}` then commit that path alone. A commit refused on git's index lock is retried after a short pause. Other seats write their own files in this same worktree; leave those alone.

      Required proof: {required_proof}

      Write your harness-recorded session spend into the artifact you commit, as a `spend:` line naming the figure and the harness field it came from.

      If a question blocks you that your read paths do not settle, write it to {question_record} — the question, your options, your recommended option — commit it, and stop. Never ask in the pane; nothing reads it. You will be restarted with the answer.
      {diagnostics}
    plan-synthesis: |
      Item {item} in repo {repo}, step {step}, attempt {attempt}. Worktree {worktree}, branch {branch}.

      Write your dispatch receipt now: one timestamp line at {receipt}. Append one line to {heartbeat} at every step you finish, starting each line with the current ISO8601 timestamp. Neither file is committed; both live under the worktree's .evidence/ directory.

      Task: read the item's brief and creation-locked design under {proof_dir}. {planning_source} Write one implementation.md in {proof_dir} covering the entire existing leaf scope. The contract carries `## Goal`, `## Owned paths`, `## Must not change`, `## Verification`, `## Acceptance criteria`, `## Ownership`, and an empty `## Completion` heading, plus the read-first paths and the symbols to change. The `## Verification` body is executed by machine: a command bullet is an optional In `<dir>`: prefix followed by backticked commands separated only by commas or `and` — no other prose in the bullet and no trailing punctuation, except an optional Inputs: object after the command. Example: Inputs: {"paths":["src/**","package.json","bun.lock"],"environment":[],"tools":["bun"]}. Paths are repo-relative globs and include every source, fixture, configuration and dependency input the command reads. Environment lists variable names, never secret values. Tools lists executables. Declare all three lists only when coverage is complete. Missing, partial or malformed declarations mean unknown inputs and force a run at each completed repair snapshot. Judges assess input completeness and repair omitted declarations when found. The machinery records these cheap command results independently of historical human evidence and leaf-verifier approval. A bullet carrying any other text is skipped as acceptance prose, so the leaf contract needs at least one bullet that parses; put explanations in prose lines outside the bullets. Keep `## Verification` bullets cheap, focused, and deterministic: local commands that prove the leaf implementation, never a paid model call or live-agent invocation. When a script supports a cheap mode (for example `--contract-only`), invoke it with that mode here; never invent such a flag for a command that lacks one. Put every expensive or live command in `## Acceptance criteria` as an executable bullet under a `Mandatory leaf checks:` line, named exactly as it must run; the leaf verifier runs those commands itself. Retain all required acceptance coverage; move checks between stages, never drop them. Every path the leaf must write appears in its `## Owned paths`, including issues/config.yaml when configuring a seat and the single report {proof_dir}/qa/implementation.md. The implementation and merge gates require that report. The `## Ownership` body is exactly `agent-owned` (default, including when absent) or `operator-owned`. Mark only steps that physically need the operator as `operator-owned`: 2FA prompts, dashboard actions on operator-held accounts, or real-payment approval. Credential access never qualifies: every secret including production lives in the consumer repo's gitignored .env by explicit operator acceptance. The implementer fills Completion with `### Premises to examine, weakest first`, `### Preserved invariants`, `### Alternatives rejected`, `### Decisions made` (each decision with its reason, shared with the checkpoint), `### Done`, `### Next`, `### Surprises and gotchas`, `### Verification state` (a per-work-item table with Status and Proof), and the harness-sourced `spend:` line.

      Contract goal content must fit {plan_bytes} UTF-8 bytes. Keep required scope, completed code, evidence and locked criteria intact. Remove repetition rather than splitting this leaf to fit a budget. Internal milestones and progress.md notes are optional worker guidance, never separately gated contracts or dispatch units.

      Plan one whole-leaf implementation assignment. Target at most 30 minutes end to end including verification, review, repair and merge, without a timeout, forced acceptance or scope reduction. Trace affected functions and callers, reuse existing code where behavior matches, and keep all required checks. Planning advances on committed proof without an approval hold. Do not materialize new leaves or rewrite the issue grouping during this assignment.

      Include up to three concrete design suggestions tied to planned code, each naming the surface and desired benefit. Prefer clear data shapes, focused functions, and straightforward conditions over unnecessary indirection or dense expressions. Do not prescribe syntax or manufacture suggestions to fill the count. Suggestions are advisory: the implementer may choose a simpler equivalent, and ignoring a suggestion alone is never a defect. Required contract and mechanical gate checks remain required.

      Commit {commit_path}. A commit refused on git index lock is retried after a short pause.

      Required proof: {required_proof}

      Write your harness-recorded session spend into the artifact you commit, as a `spend:` line naming the figure and the harness field it came from.

      If a question blocks you that your read paths do not settle, write it to {question_record} — the question, your options, your recommended option — commit it, and stop. Never ask in the pane; nothing reads it. You will be restarted with the answer.
      {diagnostics}
    implement-leaf: |
      Write your dispatch receipt now: one timestamp line at {receipt}. Append one line to {heartbeat} at every step you finish, starting each line with the current ISO8601 timestamp. Neither file is committed; both live under the worktree's .evidence/ directory.

      {skill:implement-issue}

      {packet}

      Apply only the Strong Design Guidance section at {control_root}/skills/consult-issue/advisory-quality-standards.md as advisory guidance. Preserve required behavior and gates; preferences alone never require repair.

      Before each commit, auto-apply formatting over your changed files: run `bun --no-install issues/.scripts/format-staged-check.ts` from the worktree root (diff-scoped `prettier --write`, idempotent, no arguments). Formatting never blocks a gate.

      Commit the implementation files this leaf owns plus implementation.md and the single QA report named in the packet. Stage exactly those paths, never unrelated files or .evidence/ content. Preserve earlier progress commits. Retry a git index lock refusal after a short pause.

      Required proof: {required_proof}

      Write your harness-recorded session spend into the completion half you commit, as a `spend:` line naming the figure and the harness field it came from.
      {diagnostics}
    verification: |
      Item {item} in repo {repo}, step {step}, attempt {attempt}. Worktree {worktree}, branch {branch}.

      {skill:check-issue}

      Write your dispatch receipt now: one timestamp line at {receipt}. Append one line to {heartbeat} at every step you finish, starting each line with the current ISO8601 timestamp. Neither file is committed; both live under the worktree's .evidence/ directory.

      Task: run the fork gate over the branch (`bun run quality` in issues/.scripts, the `quality.ts gate` entry point). Then collect every executable bullet under a `Mandatory leaf checks:` line in the `## Acceptance criteria` of {proof_dir}/implementation.md, dedupe by exact command plus working directory, and run each once at the head you gate, from its In `<dir>`: directory or the repository root when none is named. Write {proof_dir}/verification.md, holding a `revision: <sha>` line naming the commit you gated, one line per leaf command with its working directory, exit status, and evidence path, and one line per red run with its commit, gate, and failure signature. A red leaf command is a red run; never report pass while any failure line stands.

      Commit exactly one path: run `git add {commit_path}` then commit that path alone. A commit refused on git's index lock is retried after a short pause.

      Required proof: {required_proof}

      Write your harness-recorded session spend into the artifact you commit, as a `spend:` line naming the figure and the harness field it came from.

      If a question blocks you that your read paths do not settle, write it to {question_record} — the question, your options, your recommended option — commit it, and stop. Never ask in the pane; nothing reads it. You will be restarted with the answer.
      {diagnostics}
    pull-advice: |
      For a merge-phase blocker requiring an in-scope code correction, use disposition: repair and name the exact correction. Resume means retry without an edit. A base defect needs a named prerequisite fix, not permission to weaken a check.
      Item {item} in repo {repo}, step {step}, attempt {attempt}. Worktree {worktree}, branch {branch}.

      Write your dispatch receipt now: one timestamp line at {receipt}. Append one line to {heartbeat} at every step you finish, starting each line with the current ISO8601 timestamp. Neither file is committed; both live under the worktree's .evidence/ directory.

      Task: a seat working this item committed the question record at {question_record}. Rule on it from the item's creation-locked plan under {proof_dir}, and write the ruling — the answer, the reasons, and the plan text it follows from — into {proof_dir}/rulings/. Machinery carriers under {proof_dir} — implementation.md, `qa/`, `rulings/`, `questions/`, `verification.md`, and judge paths — are granted by the engine contract, not the plan's owned-paths list. Never rule that a required machinery path must not be written; when the plan omits one, name the omission a plan defect and require the path.

      Begin the committed ruling with disposition: answered, resume, hold, or operator-design. Use answered for a question settled within the locked contract, resume for a procedural blocker whose diagnosed correction lets work continue, and hold when no safe correction is established. Use operator-design only for a system design or architecture decision the operator must make, citing the specific locked decision or deliverable it conflicts with. Never send formatting, retries, routing, or other procedural work to the operator. Physical operator actions must never be fabricated. Explain the diagnosis and evidence in the ruling. For a procedural blocker, inspect the named proof and rejection records first, reuse already committed evidence, and prescribe the smallest correction. A resume ruling grants one retry cycle for this unchanged proof snapshot, not unlimited retries. Do not edit lifecycle state or run resume yourself.

      Commit exactly one path: run `git add {commit_path}` then commit that path alone. A commit refused on git's index lock is retried after a short pause.

      Required proof: {required_proof}

      Write your harness-recorded session spend into the artifact you commit, as a `spend:` line naming the figure and the harness field it came from.
      {diagnostics}
    repair-disposition: |
      Write your dispatch receipt now: one timestamp line at {receipt}. Append one ISO8601 progress line to {heartbeat} at each completed step. Neither file is committed.

      Item {item} in repo {repo}, step {step}, attempt {attempt}. Worktree {worktree}, branch {branch}.
      Read the committed request at {question_record}. Review only its named findings or coverage gaps against the pinned verdict and head. Reuse committed evidence and inspect affected callers where needed. Do not start a hunt, repeat a full verification pass, raise unrelated findings, edit code, or change lifecycle state. All scripts and probes you write must be TypeScript.

      Commit one JSON object at {commit_path}, with exactly verdict, head, and decisions. Copy verdict and head from the request. decisions maps every requested gap ID to an object with outcome and explanation. Use accept when the evidence settles that gap, reject-back-to-repair when a named defect still needs correction, or supply-criterion for an F- finding that needs an executable acceptance check. Only supply-criterion includes criterion, an object with command, cwd, and exit (the expected exit code). Commit and coverage gaps allow only accept or reject-back-to-repair. Explanations are free prose and must name supporting evidence. A supplied command must prove the named behavior, not merely return success. Do not add gaps or substitute a new verdict.

      Commit only {commit_path}. Leave the original request and verdict unchanged. Record your harness-measured spend and its source in an explanation without adding schema fields. Stop after committing the result.
      {diagnostics}
    arbitrate: |
      Item {item} in repo {repo}, step {step}, attempt {attempt}. Worktree {worktree}, branch {branch}.

      Write your receipt now at {receipt}. Append an ISO8601 progress line to {heartbeat} at each completed step. Both stay uncommitted.

      The operator delegated software and design decisions to you. Settle the supplied question using the locked contract and committed evidence. Preserve acceptance gates. Do not ask the operator to decide a software question. Do not edit code or lifecycle state in this decision session.

      Begin your ruling with one disposition: resume, repair, dependency, or physical. Resume retries without a code correction. Repair prescribes the exact in-item correction for an executing worker. Dependency names an existing prerequisite with a dependency: slug line. To create a prerequisite, also supply dependency-repo: configured-repo plus sections ## Dependency brief and ## Dependency design, with the reproducer and required deliverable. A main-owned defect belongs in a prerequisite, never an impossible in-item repair. Physical is reserved for an evidenced action agents cannot perform, such as supplying an unavailable credential. It requires an operator-action: line naming that action. Never invent a physical requirement to escape a failed software decision.

      Explain the evidence and executable consequence. Write only {commit_path}, then commit exactly that path. Do not answer QUESTIONS.md or run resume yourself. Your ruling is recorded as agent-authored under operator delegation. Required proof: {required_proof}

      Write a spend: line naming your harness-recorded session figure and its source field.
      {diagnostics}
    merge-repair: |
      Item {item} in repo {repo}, step {step}, attempt {attempt}. Worktree {worktree}, branch {branch}.

      Write your receipt now at {receipt}. Append an ISO8601 progress line to {heartbeat} when each step finishes.
      Apply the consultant's in-scope correction below before retrying verification. Inspect the current branch and the locked owned paths. Fix only the named defect and affected regression tests. Do not change the contract, weaken a check, merge, or resume an item yourself. If the correction requires another item's changes or unavailable access, use the question record instead of inventing a fix.
      Run the item's declared verification commands in their recorded working directories. Preserve failed results honestly. Commit the correction, then commit {commit_path} with revision: <full commit SHA> naming the corrected code, the commands, results and evidence paths. A repair proof requests independent review, not merge approval.
      Required proof: {required_proof}
      Record harness-reported spend with its source field. If blocked, commit the question and recommendation to {question_record} and stop.
      {diagnostics}
    merge-conflict: |
      Item {item} in repo {repo}, step {step}, attempt {attempt}. Worktree {worktree}, branch {branch}.

      Write your dispatch receipt now: one timestamp line at {receipt}. Append one line to {heartbeat} at every step you finish, starting each line with the current ISO8601 timestamp. Neither file is committed; both live under the worktree's .evidence/ directory.

      Task: the rebase of {branch} onto the repo's default branch stopped on conflicts and is still in progress in {worktree}. Resolve every conflicted path, finish the rebase, and re-run the item's final verification against the rebased head. Resolve each conflict by file class:
      - OWNED (a path this item's implementation.md under {proof_dir} declare as a deliverable): take the branch side, `git checkout --theirs -- <path>`.
      - SHARED-REGISTRY (`reference-index.md`, `SERIES.md`, and other row-structured indexes): union by row key; never overwrite the whole file.
      Then stage each resolved path and run `git rebase --continue` until the rebase is finished. `git merge -X theirs` is banned: a blanket strategy drops the other side of an add/add conflict on a shared registry. Then run the fork gate over the rebased branch (`bun run quality` in issues/.scripts, the `quality.ts gate` entry point).

      Beyond the rebase's own commits, commit exactly one path: rewrite {commit_path} with a `revision: <sha>` line naming the rebased commit you gated and one line per red run with its commit, gate, and failure signature, then run `git add {commit_path}` and commit that path alone. A commit refused on git's index lock is retried after a short pause.

      Required proof: {required_proof}

      Write your harness-recorded session spend into the artifact you commit, as a `spend:` line naming the figure and the harness field it came from.

      If a question blocks you that your read paths do not settle, write it to {question_record} — the question, your options, your recommended option — commit it, and stop. Never ask in the pane; nothing reads it. You will be restarted with the answer.
      {diagnostics}
    judge-hunt: |
      Item {item} in repo {repo}, step {step}, attempt {attempt}. Worktree {worktree}, branch {branch}.

      ## How to work this round

      1. Write one timestamp line at {receipt} now. Append one line to {heartbeat} at each completed step, starting each line with the current ISO8601 timestamp. Both files stay uncommitted under .evidence/.
      2. Read the changed code at the branch revision and derive what it does before reading the stated contract. Then read the item's brief, creation-locked design lines, leaf goal and completion record under {proof_dir}, and relevant tests. Compare the change against the filed problem, contract, preserved invariants, rejected alternatives, and weakest premises. Read only your own prior report, never another hunting seat's report. First round covers the whole change; later rounds cover the repairs and reachable regressions since your last reviewed revision.
      3. Apply the inlined rulebook. FIXER's brief-side duties map to the leaf completion record; its finding-judgment duties belong to the verifier. Pin both checkpoint audit revisions per seat and report the terminal revision read. Inspect missed contract items, regressions, overscope, unnecessary complexity, behavior mismatches, and verification gaps. Reproduce missing, stale, disputed, or risk-critical evidence. Reuse current deterministic command evidence only when it covers the changed surface. A child agent's output is advice you verify yourself, never proof in a report or completion claim.
      4. Append your round to {commit_path}, using the rulebook's three fixed questions, scoped verdict, stable numbered finding blocks worst first, and verification line. Give every finding the id F-<your seat name>-<n> (seat name, then your block number) so ids stay unique across hunters and match the verdict parser, which requires ids to start with F- and contain no whitespace. Give every finding its contract requirement, file and line, concrete trigger, evidence and output, smallest safe fix, and executable acceptance check. Record unresolved concerns only as the rulebook permits. Preserve previous rounds, including empty rounds.
      5. Report delivery requires committing your own per-seat report: run `git add -- {commit_path}` and commit only that path, retrying after a short pause on git's index lock. This report delivery mechanism takes precedence over hard rule 2 for that single path. Only the sole repair-authoring hunter identified by the system policy may also commit the bounded fixes that policy permits, before committing its report. Other hunters remain read-only outside their own report. The uncommitted receipt and heartbeat in step 1 are dispatch liveness records outside the repository report review scope.

