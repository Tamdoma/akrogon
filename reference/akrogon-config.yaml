      Item {item} in repo {repo}, step {step}, attempt {attempt}. Worktree {worktree}, branch {branch}.

      ## How to work this round

      1. Write one timestamp line at {receipt} now. Append one line to {heartbeat} at each completed step, starting each line with the current ISO8601 timestamp. Both files stay uncommitted under .evidence/.
