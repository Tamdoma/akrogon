grants:
  - approved:
      by: operator
      date: '2026-11-03'
      answer: "approved, let's go (handoff review: up to four short test agents per task in a throwaway herdr window)"
    principal: the leaf's implement and check seats on the operator's machine
    account: the operator's existing Claude Code, Codex, Pi and Antigravity logins
