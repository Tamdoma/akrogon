<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 724" width="560" height="724" role="img">
  <title>Pause, park and stop controls</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; fill: #1f2328; text-anchor: middle; }
    .muted { fill: #59636e; font-size: 17px; }
    .head { font-size: 19px; font-weight: 600; text-anchor: start; }
    .group { fill: none; stroke: #d0d7de; stroke-width: 2; }
    .node { fill: #f6f8fa; stroke: #8c959f; stroke-width: 2; }
    .hold { fill: #f6f8fa; stroke: #9a6700; stroke-width: 2; }
    .edge { stroke: #59636e; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#59636e"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="558" height="722" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <rect class="group" x="20" y="20" width="520" height="166" rx="10"/>
  <text class="head" x="40" y="50">Repo</text>
  <rect class="node" x="40" y="66" width="140" height="72" rx="8"/>
  <text x="110" y="108">running</text>
  <rect class="hold" x="380" y="66" width="140" height="72" rx="8"/>
  <text x="450" y="108">paused</text>
  <line class="edge" x1="180" y1="90" x2="376" y2="90" marker-end="url(#arrow)"/>
  <text class="muted" x="280" y="82">akrogon pause</text>
  <line class="edge" x1="380" y1="116" x2="184" y2="116" marker-end="url(#arrow)"/>
  <text class="muted" x="280" y="138">akrogon unpause</text>
  <text class="muted" x="280" y="168">pause holds automatic starts</text>

  <rect class="group" x="20" y="206" width="520" height="188" rx="10"/>
  <text class="head" x="40" y="236">Whole issue</text>
  <rect class="node" x="40" y="252" width="140" height="72" rx="8"/>
  <text x="110" y="294">open</text>
  <rect class="hold" x="380" y="252" width="140" height="72" rx="8"/>
  <text x="450" y="294">parked</text>
  <line class="edge" x1="180" y1="276" x2="376" y2="276" marker-end="url(#arrow)"/>
  <text class="muted" x="280" y="268">akrogon park</text>
  <line class="edge" x1="380" y1="302" x2="184" y2="302" marker-end="url(#arrow)"/>
  <text class="muted" x="280" y="324">akrogon unpark</text>
  <text class="muted" x="280" y="354">park is refused while a leaf</text>
  <text class="muted" x="280" y="376">has a tab or worktree</text>

  <rect class="group" x="20" y="414" width="520" height="290" rx="10"/>
  <text class="head" x="40" y="444">Leaf and runs</text>
  <rect class="node" x="40" y="460" width="140" height="72" rx="8"/>
  <text x="110" y="502">started</text>
  <rect class="hold" x="380" y="460" width="140" height="72" rx="8"/>
  <text x="450" y="502">stopped</text>
  <line class="edge" x1="180" y1="484" x2="376" y2="484" marker-end="url(#arrow)"/>
  <text class="muted" x="280" y="476">akrogon stop</text>
  <line class="edge" x1="380" y1="510" x2="184" y2="510" marker-end="url(#arrow)"/>
  <text class="muted" x="280" y="532">akrogon start</text>
  <rect class="node" x="60" y="556" width="440" height="48" rx="8"/>
  <text x="280" y="586">akrogon stop-run: stops one run</text>
  <rect class="node" x="60" y="616" width="440" height="72" rx="8"/>
  <text x="280" y="646">akrogon leftovers:</text>
  <text x="280" y="672">lists what cleanup kept</text>
</svg>
