<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 532" role="img">
  <title>Grounding: from the reference index to an AREA file to source code</title>
  <rect x="0" y="0" width="640" height="532" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .node { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .agent { fill: #ffffff; stroke: #0969da; stroke-width: 2; }
    .name { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .note { fill: #57606a; font-size: 14px; }
    .edge { stroke: #0969da; stroke-width: 2; fill: none; }
    .side { stroke: #8250df; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .label { fill: #0969da; font-size: 14px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
  </defs>

  <!-- The chain -->
  <rect class="node" x="24" y="24" width="320" height="120" rx="8"/>
  <text class="name" x="40" y="54">grounding.index</text>
  <text class="note" x="40" y="80">set in issues/config.yaml</text>
  <text class="note" x="40" y="104">for example</text>
  <text class="note" x="40" y="124">docs/reference-index.md</text>

  <path class="edge" d="M184,144 L184,212" marker-end="url(#arrow)"/>
  <text class="label" x="196" y="182">links to</text>

  <rect class="node" x="24" y="214" width="320" height="120" rx="8"/>
  <text class="name" x="40" y="244">AREA.md</text>
  <text class="note" x="40" y="270">for example src/AREA.md</text>
  <text class="note" x="40" y="294">commands, key files and</text>
  <text class="note" x="40" y="314">local constraints</text>

  <path class="edge" d="M184,334 L184,402" marker-end="url(#arrow)"/>
  <text class="label" x="196" y="372">points to</text>

  <rect class="node" x="24" y="404" width="320" height="104" rx="8"/>
  <text class="name" x="40" y="434">Source file</text>
  <text class="note" x="40" y="460">for example src/scope.ts</text>
  <text class="note" x="40" y="484">real code and tests</text>

  <!-- The agents that read along it -->
  <rect class="agent" x="392" y="24" width="224" height="120" rx="8"/>
  <text class="name" x="408" y="54">Plan agent</text>
  <text class="note" x="408" y="80">reads the index, the</text>
  <text class="note" x="408" y="102">relevant areas and</text>
  <text class="note" x="408" y="124">their files</text>
  <path class="edge" d="M392,76 L346,76" marker-end="url(#arrow)"/>
  <text class="label" x="369" y="66" text-anchor="middle">reads</text>

  <path class="edge" d="M504,144 L504,212" marker-end="url(#arrow)"/>
  <text class="label" x="512" y="182">read-first list</text>

  <rect class="agent" x="392" y="214" width="224" height="120" rx="8"/>
  <text class="name" x="408" y="244">Implement agent</text>
  <text class="note" x="408" y="270">works from the plan's</text>
  <text class="note" x="408" y="292">read-first list, opens</text>
  <text class="note" x="408" y="314">the index only on a gap</text>
  <path class="side" d="M392,300 L368,300 L368,112 L346,112"/>
</svg>
