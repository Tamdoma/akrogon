<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 800" width="560" height="800" role="img">
  <title>A working day from intake to merged</title>
  <rect x="1" y="1" width="558" height="798" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t { fill: #1f2328; font-size: 18px; }
    .m { fill: #59636e; font-size: 17px; }
    .n { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .o { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .e { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .d { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .marker { animation: day 14s ease-in-out infinite; }
    @keyframes day {
      0%, 6% { transform: translate(0px, -600px); }
      16%, 24% { transform: translate(0px, -510px); }
      36%, 44% { transform: translate(0px, -340px); }
      52%, 58% { transform: translate(0px, -260px); }
      66%, 72% { transform: translate(0px, -170px); }
      80%, 86% { transform: translate(0px, -80px); }
      94%, 100% { transform: translate(0px, 0px); }
    }
    @media (prefers-reduced-motion: reduce) { .marker { animation: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"/>
    </marker>
  </defs>

  <rect class="n" x="40" y="20" width="485" height="70" rx="8"/>
  <text class="t" x="290" y="49" text-anchor="middle">intake: a local note, a GitHub issue,<tspan x="290" dy="24">or a seed brought in by akrogon pull</tspan></text>

  <rect class="n" x="40" y="120" width="250" height="50" rx="8"/>
  <text class="t" x="175" y="151" text-anchor="middle">/chart-issues</text>

  <rect class="n" x="310" y="120" width="215" height="90" rx="8"/>
  <text class="t" x="417" y="148" text-anchor="middle">direct route: door<tspan x="417" dy="24">builds, B reviews,</tspan><tspan x="417" dy="24">door lands</tspan></text>

  <rect class="o" x="310" y="235" width="215" height="80" rx="8"/>
  <text class="m" x="417" y="258" text-anchor="middle">autopilot charts and<tspan x="417" dy="22">hands off,</tspan><tspan x="417" dy="22">starts nothing</tspan></text>

  <rect class="n" x="40" y="290" width="250" height="50" rx="8"/>
  <text class="t" x="175" y="321" text-anchor="middle">handoff to issues/open</text>
  <rect class="n" x="40" y="370" width="250" height="50" rx="8"/>
  <text class="t" x="175" y="401" text-anchor="middle">akrogon next</text>
  <rect class="n" x="40" y="450" width="250" height="70" rx="8"/>
  <text class="t" x="175" y="480" text-anchor="middle">seats plan, build,<tspan x="175" dy="24">review, repair</tspan></text>
  <rect class="n" x="40" y="550" width="250" height="50" rx="8"/>
  <text class="t" x="175" y="581" text-anchor="middle">the command lands</text>
  <rect class="n" x="40" y="630" width="250" height="50" rx="8" style="stroke: #1a7f37"/>
  <text class="t" x="175" y="661" text-anchor="middle">merged</text>

  <rect class="o" x="310" y="455" width="190" height="50" rx="8"/>
  <text class="m" x="405" y="486" text-anchor="middle">watch-issues</text>

  <rect class="o" x="40" y="710" width="250" height="70" rx="8"/>
  <text class="m" x="175" y="739" text-anchor="middle">broadcast, once per<tspan x="175" dy="22">finished issue</tspan></text>

  <line class="e" x1="175" y1="90" x2="175" y2="118" marker-end="url(#arrow)"/>
  <line class="e" x1="290" y1="145" x2="308" y2="145" marker-end="url(#arrow)"/>
  <line class="e" x1="175" y1="170" x2="175" y2="288" marker-end="url(#arrow)"/>
  <line class="d" x1="310" y1="275" x2="175" y2="275"/>
  <line class="e" x1="175" y1="340" x2="175" y2="368" marker-end="url(#arrow)"/>
  <line class="e" x1="175" y1="420" x2="175" y2="448" marker-end="url(#arrow)"/>
  <line class="e" x1="175" y1="520" x2="175" y2="548" marker-end="url(#arrow)"/>
  <line class="e" x1="175" y1="600" x2="175" y2="628" marker-end="url(#arrow)"/>
  <line class="d" x1="175" y1="680" x2="175" y2="708" marker-end="url(#arrow)"/>
  <path class="d" d="M296,395 H302 V575 H296"/>
  <line class="d" x1="302" y1="480" x2="310" y2="480"/>
  <path class="e" d="M525,165 H542 V655 H292" marker-end="url(#arrow)"/>

  <circle class="marker" cx="56" cy="655" r="8" fill="#0969da"/>
</svg>
