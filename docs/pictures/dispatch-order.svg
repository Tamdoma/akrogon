<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 530" width="560" height="530" role="img">
  <title>How open leaves are started in order</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; fill: #1f2328; text-anchor: middle; }
    .muted { fill: #59636e; font-size: 17px; }
    .node { fill: #f6f8fa; stroke: #8c959f; stroke-width: 2; }
    .edge { stroke: #59636e; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#59636e"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="558" height="528" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <rect class="node" x="80" y="24" width="400" height="76" rx="8"/>
  <text x="280" y="56">open leaves (in issues/open,</text>
  <text x="280" y="82">not stopped or failed)</text>

  <line class="edge" x1="280" y1="100" x2="280" y2="136" marker-end="url(#arrow)"/>

  <rect class="node" x="110" y="140" width="340" height="56" rx="8" style="stroke: #0969da;"/>
  <text x="280" y="175">blocked-by all merged?</text>

  <line class="edge" x1="190" y1="196" x2="125" y2="262" marker-end="url(#arrow)"/>
  <text class="muted" x="136" y="226">no</text>
  <line class="edge" x1="370" y1="196" x2="385" y2="262" marker-end="url(#arrow)"/>
  <text class="muted" x="406" y="234">yes</text>

  <rect class="node" x="30" y="266" width="180" height="56" rx="8" style="stroke: #9a6700;"/>
  <text x="120" y="301">waiting</text>

  <rect class="node" x="240" y="266" width="290" height="104" rx="8"/>
  <text x="385" y="298">order rule: merged leaves</text>
  <text x="385" y="324">first, then most waiting</text>
  <text x="385" y="350">dependents</text>

  <line class="edge" x1="385" y1="370" x2="385" y2="416" marker-end="url(#arrow)"/>

  <rect class="node" x="290" y="420" width="190" height="56" rx="8" style="stroke: #1a7f37;"/>
  <text x="385" y="455">started</text>
  <text class="muted" x="385" y="506">up to max_active at once</text>
</svg>
