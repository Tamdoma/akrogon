<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" role="img">
  <title>Two seats: build, review, repair</title>
  <rect x="0" y="0" width="640" height="620" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; fill: #1f2328; }
    .title { font-size: 18px; font-weight: 600; }
    .muted { font-size: 14px; fill: #57606a; }
    .node { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .edge { fill: none; stroke: #57606a; stroke-width: 1.5; marker-end: url(#arrow); }
    .step { animation: pulse 9s ease-in-out infinite; }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 1.5s; }
    .s3 { animation-delay: 3s; }
    .s4 { animation-delay: 4.5s; }
    .s5 { animation-delay: 6s; }
    .s6 { animation-delay: 7.5s; }
    @keyframes pulse {
      0%, 16%, 100% { stroke: #8c959f; stroke-width: 1.5; }
      8% { stroke: #0969da; stroke-width: 3; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text class="title" x="24" y="38">Two seats: build, review, repair</text>

  <!-- build -->
  <rect class="node step s1" x="220" y="56" width="200" height="44" rx="8"/>
  <text x="320" y="83" text-anchor="middle">A implements</text>

  <!-- two blind reviews -->
  <rect class="node step s2" x="40" y="148" width="250" height="44" rx="8"/>
  <text x="165" y="175" text-anchor="middle">A reviews (blind)</text>
  <rect class="node step s2" x="350" y="148" width="250" height="44" rx="8"/>
  <text x="475" y="175" text-anchor="middle">B reviews (blind)</text>
  <text class="muted" x="320" y="216" text-anchor="middle">neither reads the other's review</text>
  <path class="edge" d="M280 100 L167 146"/>
  <path class="edge" d="M360 100 L473 146"/>

  <!-- findings -->
  <rect class="node step s3" x="220" y="240" width="200" height="44" rx="8"/>
  <text x="320" y="267" text-anchor="middle">findings?</text>
  <path class="edge" d="M165 192 L258 238"/>
  <path class="edge" d="M475 192 L382 238"/>

  <!-- repairs -->
  <rect class="node step s4" x="40" y="330" width="250" height="56" rx="8"/>
  <text x="165" y="353" text-anchor="middle">B repairs most</text>
  <text class="muted" x="165" y="374" text-anchor="middle">(check.repair)</text>
  <path class="edge" d="M240 284 L180 328"/>
  <text class="muted" x="226" y="314" text-anchor="end">fix</text>

  <rect class="node step s5" x="350" y="430" width="250" height="56" rx="8"/>
  <text x="475" y="453" text-anchor="middle">A repairs named exceptions</text>
  <text class="muted" x="475" y="474" text-anchor="middle">(check.fix)</text>
  <path class="edge" d="M290 358 H475 V428"/>
  <text class="muted" x="383" y="350" text-anchor="middle">handed to A</text>

  <!-- A's repair goes back to B's review -->
  <path class="edge" d="M600 458 H624 V170 H602"/>
  <text class="muted" x="612" y="322" text-anchor="end">B re-checks</text>

  <!-- merge -->
  <rect class="node step s6" x="220" y="540" width="200" height="44" rx="8"/>
  <text x="320" y="567" text-anchor="middle">merge</text>
  <path class="edge" d="M220 262 H20 V556 H218"/>
  <text class="muted" x="120" y="254" text-anchor="middle">pass</text>
  <path class="edge" d="M200 386 L268 538"/>
  <text class="muted" x="226" y="470" text-anchor="end">all repaired</text>
</svg>
