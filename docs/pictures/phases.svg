<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 680" role="img">
  <title>Leaf phases</title>
  <rect x="0" y="0" width="640" height="680" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .head { font-size: 20px; font-weight: 600; }
    .name { font-size: 15px; font-weight: 600; }
    .muted { fill: #57606a; }
    .accent { fill: #0969da; }
    .stop { fill: #cf222e; }
    .node { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .start { fill: #f6f8fa; stroke: #0969da; stroke-width: 2.5; }
    .fail { fill: #ffebe9; stroke: #cf222e; stroke-width: 2; }
    .zone { fill: none; stroke: #cf222e; stroke-width: 2; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .edge-stop { stroke: #cf222e; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Heading -->
  <text class="head" x="24" y="40">Leaf phases</text>

  <!-- Working phases: the red box is where failed can be reached -->
  <rect class="zone" x="24" y="64" width="600" height="500" rx="10"/>

  <!-- Plan -->
  <rect class="start" x="70" y="80" width="200" height="60" rx="8"/>
  <text class="name" x="170" y="105" text-anchor="middle">plan.synthesis</text>
  <text class="accent" x="170" y="126" text-anchor="middle">a leaf starts here</text>

  <!-- Build and check -->
  <rect class="node" x="70" y="190" width="200" height="48" rx="8"/>
  <text class="name" x="170" y="219" text-anchor="middle">implement</text>
  <rect class="node" x="70" y="290" width="200" height="48" rx="8"/>
  <text class="name" x="170" y="319" text-anchor="middle">check.review</text>
  <rect class="node" x="370" y="290" width="200" height="48" rx="8"/>
  <text class="name" x="470" y="319" text-anchor="middle">check.fix</text>
  <rect class="node" x="370" y="400" width="200" height="48" rx="8"/>
  <text class="name" x="470" y="429" text-anchor="middle">check.repair</text>
  <rect class="node" x="70" y="500" width="200" height="48" rx="8"/>
  <text class="name" x="170" y="529" text-anchor="middle">merge</text>

  <!-- Ends -->
  <rect class="node" x="70" y="590" width="200" height="48" rx="8"/>
  <text class="name" x="170" y="619" text-anchor="middle">merged</text>
  <rect class="fail" x="330" y="590" width="280" height="60" rx="8"/>
  <text class="name stop" x="470" y="615" text-anchor="middle">failed</text>
  <text class="stop" x="470" y="636" text-anchor="middle">any boxed phase can stop here</text>

  <!-- Edges -->
  <line class="edge" x1="170" y1="140" x2="170" y2="190" marker-end="url(#arrow)"/>
  <line class="edge" x1="170" y1="238" x2="170" y2="290" marker-end="url(#arrow)"/>
  <line class="edge" x1="170" y1="338" x2="170" y2="500" marker-end="url(#arrow)"/>
  <text class="muted" x="160" y="425" text-anchor="end">no fix verdict</text>
  <line class="edge" x1="250" y1="338" x2="450" y2="400" marker-end="url(#arrow)"/>
  <text class="muted" x="360" y="355">a fix verdict</text>
  <line class="edge" x1="370" y1="430" x2="250" y2="500" marker-end="url(#arrow)"/>
  <line class="edge" x1="470" y1="400" x2="470" y2="338" marker-end="url(#arrow)"/>
  <line class="edge" x1="370" y1="314" x2="270" y2="314" marker-end="url(#arrow)"/>
  <path class="edge" d="M270,524 H604 V314 H570" marker-end="url(#arrow)"/>
  <line class="edge" x1="170" y1="548" x2="170" y2="590" marker-end="url(#arrow)"/>
  <line class="edge-stop" x1="470" y1="564" x2="470" y2="590" marker-end="url(#arrow)"/>
</svg>
