<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 576" width="560" height="576" role="img">
<title>How a lesson is recorded and sorted</title>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; fill: #1f2328; text-anchor: middle; }
.m { font-size: 17px; fill: #59636e; }
.n { fill: #f6f8fa; stroke: #8c959f; stroke-width: 2; }
.e { fill: none; stroke: #59636e; stroke-width: 2; }
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker>
</defs>
<rect x="1" y="1" width="558" height="574" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect class="n" x="140" y="24" width="280" height="50" rx="8"/>
<text x="280" y="55">finding</text>
<line class="e" x1="280" y1="74" x2="280" y2="104" marker-end="url(#a)"/>
<rect class="n" x="60" y="106" width="440" height="50" rx="8"/>
<text x="280" y="137">LESSONS.md line + history file</text>
<line class="e" x1="280" y1="156" x2="280" y2="186" marker-end="url(#a)"/>
<rect class="n" x="140" y="188" width="280" height="50" rx="8" style="stroke: #0969da;"/>
<text x="280" y="219">/learn-issues sorts</text>
<path class="e" d="M280 238 V256 H60 V525"/>
<line class="e" x1="60" y1="301" x2="88" y2="301" marker-end="url(#a)"/>
<rect class="n" x="90" y="276" width="440" height="50" rx="8"/>
<text x="310" y="307">stopped: line removed</text>
<line class="e" x1="60" y1="367" x2="88" y2="367" marker-end="url(#a)"/>
<rect class="n" x="90" y="342" width="440" height="50" rx="8"/>
<text x="310" y="373">checkable: seed line printed</text>
<line class="e" x1="60" y1="446" x2="88" y2="446" marker-end="url(#a)"/>
<rect class="n" x="90" y="408" width="440" height="76" rx="8"/>
<text x="310" y="440">transfer: moved into a review<tspan x="310" dy="24">step after your approval</tspan></text>
<line class="e" x1="60" y1="525" x2="88" y2="525" marker-end="url(#a)"/>
<rect class="n" x="90" y="500" width="440" height="50" rx="8"/>
<text x="310" y="531">stays: unchanged</text>
</svg>
