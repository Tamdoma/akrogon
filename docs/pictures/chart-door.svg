<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img">
  <title>The chart door</title>
  <rect x="0" y="0" width="640" height="700" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; fill: #1f2328; }
    .title { font-size: 18px; font-weight: 600; }
    .muted { font-size: 14px; fill: #57606a; }
    .node { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .edge { fill: none; stroke: #57606a; stroke-width: 1.5; marker-end: url(#arrow); }
    .both { marker-start: url(#arrow); }
    .step { animation: pulse 1.2s ease-in-out 1 forwards; }
    .s1 { animation-delay: 0.3s; }
    .s2 { animation-delay: 1.1s; }
    .s3 { animation-delay: 1.9s; }
    .s4 { animation-delay: 2.7s; }
    .s5 { animation-delay: 3.5s; }
    .s6 { animation-delay: 4.3s; }
    .s7 { animation-delay: 5.1s; }
    .s8 { animation-delay: 5.9s; }
    .s9 { animation-delay: 6.7s; }
    @keyframes pulse {
      0%, 100% { stroke: #8c959f; stroke-width: 1.5; }
      50% { stroke: #0969da; stroke-width: 3; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text class="title" x="24" y="38">The chart door</text>

  <!-- you, A and the consultants -->
  <rect class="node step s1" x="40" y="76" width="140" height="50" rx="8"/>
  <text x="110" y="106" text-anchor="middle">you</text>

  <rect class="node step s2" x="250" y="76" width="140" height="50" rx="8"/>
  <text x="320" y="106" text-anchor="middle">A</text>

  <rect class="node step s3" x="460" y="56" width="140" height="40" rx="6"/>
  <text x="530" y="81" text-anchor="middle">B: blind note</text>
  <rect class="node step s3" x="460" y="106" width="140" height="40" rx="6"/>
  <text x="530" y="131" text-anchor="middle">C: blind note</text>

  <path class="edge both" d="M182 101 H248"/>
  <path class="edge both" d="M392 95 L458 78"/>
  <path class="edge both" d="M392 107 L458 124"/>

  <!-- merge and rebuttal -->
  <rect class="node step s4" x="120" y="196" width="400" height="56" rx="8"/>
  <text x="320" y="219" text-anchor="middle">A merges the notes</text>
  <text class="muted" x="320" y="240" text-anchor="middle">tags show who agreed, like (A,B)</text>
  <path class="edge" d="M320 126 V194"/>
  <path class="edge" d="M530 146 L470 194"/>

  <rect class="node step s5" x="120" y="280" width="400" height="56" rx="8"/>
  <text x="320" y="303" text-anchor="middle">rebuttal</text>
  <text class="muted" x="320" y="324" text-anchor="middle">each consultant names only disagreements</text>
  <path class="edge" d="M320 252 V278"/>

  <!-- rounds to contract -->
  <rect class="node step s6" x="120" y="364" width="400" height="56" rx="8"/>
  <text x="320" y="387" text-anchor="middle">rounds</text>
  <text class="muted" x="320" y="408" text-anchor="middle">A presents one fork at a time, you answer</text>
  <path class="edge" d="M320 336 V362"/>

  <rect class="node step s7" x="120" y="448" width="400" height="44" rx="8"/>
  <text x="320" y="475" text-anchor="middle">forks taken</text>
  <path class="edge" d="M320 420 V446"/>

  <rect class="node step s8" x="120" y="520" width="400" height="56" rx="8"/>
  <text x="320" y="543" text-anchor="middle">handoff review</text>
  <text class="muted" x="320" y="564" text-anchor="middle">you approve the contracts</text>
  <path class="edge" d="M320 492 V518"/>

  <rect class="node step s9" x="120" y="604" width="400" height="44" rx="8"/>
  <text x="320" y="631" text-anchor="middle">contract in issues/open</text>
  <path class="edge" d="M320 576 V602"/>

  <text class="muted" x="24" y="680">Consultants work blind: none reads another's note before A merges.</text>
</svg>
