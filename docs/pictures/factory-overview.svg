<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img">
  <title>How work moves through akrogon</title>
  <rect x="0" y="0" width="640" height="660" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; fill: #1f2328; }
    .title { font-size: 18px; font-weight: 600; }
    .small { font-size: 14px; }
    .muted { font-size: 14px; fill: #57606a; }
    .side-text { font-size: 14px; fill: #8250df; }
    .node { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .side-node { fill: #f6f8fa; stroke: #8250df; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: #57606a; stroke-width: 1.5; marker-end: url(#arrow); }
    .side-edge { fill: none; stroke: #8250df; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    .step { animation: pulse 1.2s ease-in-out 1 forwards; }
    .s1 { animation-delay: 0.3s; }
    .s2 { animation-delay: 1.1s; }
    .s3 { animation-delay: 1.9s; }
    .s4 { animation-delay: 2.7s; }
    .s5 { animation-delay: 3.5s; }
    .s6 { animation-delay: 4.3s; }
    .s7 { animation-delay: 5.1s; }
    .s8 { animation-delay: 5.9s; }
    @keyframes pulse {
      0%, 100% { stroke: #8c959f; stroke-width: 1.5; }
      50% { stroke: #0969da; stroke-width: 3; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text class="title" x="24" y="38">How work moves through akrogon</text>

  <!-- main path nodes -->
  <rect class="node step s1" x="40" y="60" width="360" height="44" rx="8"/>
  <text x="220" y="87" text-anchor="middle">request</text>

  <rect class="node step s2" x="40" y="132" width="360" height="44" rx="8"/>
  <text x="220" y="159" text-anchor="middle">chart door (you + A)</text>

  <rect class="node step s3" x="40" y="204" width="360" height="44" rx="8"/>
  <text x="220" y="231" text-anchor="middle">contract in issues/open</text>

  <rect class="node step s4" x="40" y="276" width="360" height="44" rx="8"/>
  <text x="220" y="303" text-anchor="middle">build</text>

  <rect class="node step s5" x="40" y="348" width="360" height="44" rx="8"/>
  <text x="220" y="375" text-anchor="middle">independent review</text>

  <rect class="node step s6" x="40" y="420" width="360" height="44" rx="8"/>
  <text x="220" y="447" text-anchor="middle">repair if needed</text>

  <rect class="node step s7" x="40" y="492" width="360" height="44" rx="8"/>
  <text x="220" y="519" text-anchor="middle">command lands</text>

  <rect class="node step s8" x="40" y="564" width="360" height="44" rx="8"/>
  <text x="220" y="591" text-anchor="middle">merged</text>

  <!-- main path edges -->
  <path class="edge" d="M220 104 V130"/>
  <path class="edge" d="M220 176 V202"/>
  <path class="edge" d="M220 248 V274"/>
  <path class="edge" d="M220 320 V346"/>
  <path class="edge" d="M220 392 V418"/>
  <path class="edge" d="M220 464 V490"/>
  <path class="edge" d="M220 536 V562"/>

  <!-- repair loops back to review -->
  <path class="edge" d="M40 442 H20 V370 H38"/>

  <!-- direct route side branch -->
  <path class="side-edge" d="M400 154 H525 V166"/>
  <rect class="side-node" x="430" y="168" width="190" height="150" rx="8"/>
  <text class="side-text" x="442" y="192" font-weight="600">direct route:</text>
  <text class="small" x="442" y="213">same charted decisions</text>
  <text class="small" x="442" y="233">and B review,</text>
  <text class="small" x="442" y="253">no leaf handoff,</text>
  <text class="small" x="442" y="273">no lifecycle dispatch</text>
  <text class="muted" x="442" y="301">door lands it itself</text>
  <path class="side-edge" d="M525 318 V586 H402"/>

  <text class="muted" x="24" y="640">Purple dashed: the optional direct route for one small settled chart.</text>
</svg>
